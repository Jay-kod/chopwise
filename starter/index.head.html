<!-- Paste inside <head> in index.html. The inline script MUST come before any CSS/JS bundle so the page never flashes the wrong theme. -->
<title>ChopWise</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Nigerian meals that fit your health and your wallet." />
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0B1410" media="(prefers-color-scheme: dark)" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script>
  (function () {
    try {
      var pref = localStorage.getItem('chopwise-theme') || 'system';
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var root = document.documentElement;
      if (dark) root.classList.add('dark');
      root.style.colorScheme = dark ? 'dark' : 'light';
    } catch (e) {}
  })();
</script>
